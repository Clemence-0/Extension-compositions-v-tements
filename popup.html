<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#fff; --fg:#1c1c1e; --muted:#6e6e73; --line:#e5e5ea; --accent:#1f7a4d; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#38383a; --accent:#34c77b; } }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 14px 16px 12px; background: var(--bg); color: var(--fg);
           font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; accent-color: var(--accent); }
    header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    h1 { font-size: 15px; margin: 0; }
    #host { color: var(--muted); font-size: 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing:.04em; color: var(--muted); margin: 0 0 6px; }
    section { border-top: 1px solid var(--line); padding: 10px 0; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .big { font-weight: 600; font-size: 14px; padding: 4px 0 10px; }
    input[type=range] { width: 100%; }
    output { font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-bottom: 8px; }
    label { display:flex; align-items:center; gap:6px; cursor:pointer; }
    .stack { display:flex; flex-direction:column; gap:5px; }
    button { width:100%; padding:7px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; font: inherit; }
    button:hover { border-color: var(--muted); }
  </style>
</head>
<body>
  <header><h1>🧵 Filtre Fibres</h1><span id="host"></span></header>

  <label class="row big"><span>Activer sur ce site</span><input type="checkbox" id="enabled"></label>

  <section>
    <div class="row"><h2>Seuil</h2><output id="thVal"></output></div>
    <input type="range" id="threshold" min="0" max="100" step="5">
    <p class="hint">Écarte l'article si la part des fibres cochées dépasse ce seuil.</p>
  </section>

  <section class="stack">
    <h2>Articles analysés</h2>
    <div id="types" class="stack"></div>
    <p class="hint">Les autres (et parfums, bijoux…) sont ignorés, sans pastille.</p>
  </section>

  <section>
    <h2>Synthétiques</h2><div id="synth" class="grid"></div>
    <h2>Artificielles</h2><div id="art" class="grid"></div>
  </section>

  <section class="stack">
    <h2>Affichage</h2>
    <label><input type="radio" name="mode" value="hide"> Masquer les articles</label>
    <label><input type="radio" name="mode" value="dim"> Les griser seulement</label>
    <label><input type="checkbox" id="badges"> Pastille de composition sur chaque article</label>
    <label><input type="checkbox" id="hideUnknown"> Écarter aussi les compositions introuvables</label>
  </section>

  <section><button id="clear">Vider le cache des compositions</button></section>

  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
